[project]
name = "bench-extract"
version = "0.1.0"
description = "Benchmarking routing/cascade/scheduling strategies for information extraction over VRDU."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "httpx>=0.27",
    # Used by bench_extract.datasets.matching (edit-distance matching, ported
    # from VRDU's official evaluator) -- core, not experiments-only.
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# Tooling for experiments/{run_benchmark,run_training}.py and tests. Not
# required by bench_extract itself.
experiments = [
    "pytest>=8.0",
    "matplotlib>=3.9",
]
# NOTE: vllm is deliberately NOT declared as a dependency here. experiments/
# serving.py's LocalVLLMServer only shells out to a `vllm serve ...`
# subprocess -- it never imports vllm in-process. Install vllm into its own
# separate environment on the GPU box (e.g. `uv tool install vllm`) so its
# CLI is on PATH; do not add it to this project's dependencies.
#
# The seven routing/cascade/scheduling methods' upstream repos (LLMRouter,
# FrugalGPT, BARGAIN, task-cascades, palimpzest, Doctopus, cascade-routing)
# pin conflicting torch/transformers versions. As each adapter in
# src/bench_extract/extractors/ is actually wired in (see each file's
# docstring), add it here as its own optional-dependency extra
# (e.g. `hybridllm = [...]`), isolated from the others -- mirroring
# govscape-extract's GLiNER2/vllm isolation. None are added yet.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_extract"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
