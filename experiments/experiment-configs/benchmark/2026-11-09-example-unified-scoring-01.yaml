id: 2026-11-09-example-unified-scoring-01
project: bench-extract
description: >-
  Example of the opt-in unified, cross-dataset accuracy measure
  (bench_extract.scoring.unified): same route/cascade/schedule baselines as
  2026-09-21-example-benchmark-01, but every cell is scored by field type
  (date / quantity / identifier exact after normalization, short text by
  Levenshtein similarity, long text by token F1), lists are matched one-to-one
  (Hungarian, similarity >= match_threshold) into a soft F1, ad-buy-form line
  items are scored as whole records, and cells empty on both sides are left
  out. Swap dataset/dataset_params for cuad to get a directly comparable
  number. Needs data/vrdu/data.json written by the current
  data/download_vrdu.py (grouped ground truth). Start gpt-oss-120b's server
  first: `bash experiments/submit.sh serve gpt-oss-120b`.
seed: 0
params:
  dataset: vrdu
  dataset_params:
    corpus: ad-buy-form
    split_file: DeepForm-mixed_template-train_10-test_300-valid_100-SD_0
  model_keys: [gpt-oss-120b]
  methods: [route_baseline, cascade_baseline, schedule_baseline]
  limit: null
  scoring:
    measure: unified
    match_threshold: 0.5
    quantity_decimals: 2
