id: 2026-10-19-abacus-smoke-3model-01
project: bench-extract
description: >-
  Smoke test of Abacus (MaxQuality) over the real M = {qwen3.5-4b, gemma-4-12b, gpt-oss-120b} on
  tiny `limit`/`sample_budget`: checks that all three servers are reachable at once and that the
  serve -> pz optimize -> run -> metrics/steps.csv path works. Not an accuracy result. Start all
  three servers first (`bash experiments/submit.sh serve <model-key>`).
seed: 0
params:
  dataset: vrdu
  dataset_params:
    corpus: ad-buy-form
    split_file: DeepForm-mixed_template-train_100-test_300-valid_100-SD_0
  model_keys: [qwen3.5-4b, gemma-4-12b, gpt-oss-120b]
  methods: [abacus]
  limit: 3
  method_kwargs:
    abacus:
      policy: {name: MaxQuality}
      validator: score_field
      pz_config:
        seed: 0
        sample_budget: 5
