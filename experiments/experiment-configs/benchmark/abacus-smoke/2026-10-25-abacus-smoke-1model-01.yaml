id: 2026-10-25-abacus-smoke-1model-01
project: bench-extract
description: >-
  Smoke test of Abacus (MaxQuality) over M = {qwen3.5-4b} only -- the other servers were still
  queued. Same sizes as 2026-10-25-abacus-smoke-2model-01. Checks the serve -> pz optimize -> run
  -> metrics/steps.csv path end to end against a real vLLM server and yields a first rough
  accuracy/cost read for qwen. With one model there is nothing for Abacus to choose between, so
  this says nothing about routing. Start the server first (`bash experiments/submit.sh serve qwen3.5-4b`).
seed: 0
params:
  dataset: vrdu
  dataset_params:
    corpus: ad-buy-form
    split_file: DeepForm-mixed_template-train_100-test_300-valid_100-SD_0
  model_keys: [qwen3.5-4b]
  methods: [abacus]
  limit: 10
  method_kwargs:
    abacus:
      policy: {name: MaxQuality}
      validator: score_field
      pz_config:
        seed: 0
        sample_budget: 10
