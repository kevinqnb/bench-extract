id: 2026-09-21-example-training-01
project: bench-extract
description: >-
  Example training-size sweep: route_baseline accuracy/efficiency vs. VRDU's
  official train_{10,50,100,200} splits (SD_0) on the ad-buy-form
  unk_template task. Start gpt-oss-120b's server first:
  `bash experiments/submit.sh serve gpt-oss-120b`.
seed: 0
params:
  corpus: ad-buy-form
  split_files:
    - DeepForm-unk_template-train_10-test_294-valid_100-SD_0
    - DeepForm-unk_template-train_50-test_239-valid_100-SD_0
    - DeepForm-unk_template-train_100-test_215-valid_100-SD_0
    - DeepForm-unk_template-train_200-test_159-valid_100-SD_0
  model_keys: [gpt-oss-120b]
  methods: [route_baseline]
  limit: null
